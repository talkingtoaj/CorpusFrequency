{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}
    <a href="{% querystring page=1 %}" aria-label="First page">&laquo; First</a>
    <a href="{% querystring page=page_obj.previous_page_number %}" rel="prev">Previous</a>
  {% endif %}
  <span class="position">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a href="{% querystring page=page_obj.next_page_number %}" rel="next">Next</a>
    <a href="{% querystring page=page_obj.paginator.num_pages %}" aria-label="Last page">Last &raquo;</a>
  {% endif %}
</nav>
{% endif %}
