{% extends "corpus/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if form.errors %}<p class="warning">Username and password did not match.</p>{% endif %}
<form method="post" class="stack">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Log in</button>
</form>
{% endblock %}
