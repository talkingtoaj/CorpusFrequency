{% extends "nav.html" %}
{% block content %}
{% for element in list %}
    <div>
        <input type="checkbox" class="ngram-checkbox" data-ngram="{{element.ngram}}" {{'checked' if element.selected else ''}}>
        <a href="{{ '/sentences/'+ element.ngram }}" class="ngram-link">{{element.ngram}} - {{element.count}}</a>
    </div>
{% endfor %}
<script src="{{ url_for('static', filename='script.js')}}"></script>
{% endblock %}
