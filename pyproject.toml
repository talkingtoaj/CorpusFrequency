[project]
name = "corpusfrequency"
version = "0.1.0"
description = "Analyse the most frequent words and phrases in a corpus of documents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "docx2txt>=0.9",
    "flask>=3.1.2",
    "nltk>=3.9.2",
    "psycopg[binary]>=3.3.5",
    "pypdf>=6.17.0",
    "python-docx>=1.2.0",
    "scikit-learn>=1.8.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "playwright>=1.49.0",
    "pylint>=4.0.4",
    "pytest>=8.3.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pkg_resources"]
